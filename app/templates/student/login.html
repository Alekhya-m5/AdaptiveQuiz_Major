{% extends "base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="mb-3">Student Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">USN</label>
                    <input type="text" name="usn" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="mt-3 text-center">New here? <a href="{{ url_for('student.register') }}">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
