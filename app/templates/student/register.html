{% extends "base.html" %}
{% block title %}Student Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="mb-3">Student Registration</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">USN</label>
                    <input type="text" name="usn" class="form-control" required placeholder="e.g. 4SD22CS001">
                </div>
                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Course</label>
                    <select name="course" class="form-select">
                        {% for c in courses %}
                            <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('student.login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
