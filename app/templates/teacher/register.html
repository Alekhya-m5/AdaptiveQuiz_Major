{% extends "base.html" %}
{% block title %}Teacher Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="mb-3">Teacher Registration</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Teacher ID</label>
                    <input type="text" name="teacher_id" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('teacher.login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
